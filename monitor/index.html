<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Monitor de unidades</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --tx:#1a1d21; --mut:#6b7280; --bd:#e5e7eb; --up:#15803d; --down:#b91c1c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1115; --card:#181b21; --tx:#e8eaed; --mut:#9aa0a6; --bd:#2a2e36; --up:#4ade80; --down:#f87171; }
    }
    * { box-sizing: border-box; }
    body { margin:0; font:15px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--tx); }
    main { max-width:1000px; margin:0 auto; padding:24px 16px; }
    h1 { font-size:22px; margin:0 0 4px; }
    .mut { color:var(--mut); font-size:13px; }
    .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); margin-top:18px; }
    .card { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:16px; color:inherit; text-decoration:none; display:block; }
    .card:hover { border-color:var(--mut); }
    .card h2 { font-size:17px; margin:0 0 8px; }
    .linha { display:flex; justify-content:space-between; gap:8px; padding:3px 0; }
    .up { color:var(--up); } .down { color:var(--down); }
    table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--bd); border-radius:10px; margin-top:16px; font-size:14px; }
    th, td { padding:8px 10px; border-bottom:1px solid var(--bd); text-align:right; white-space:nowrap; }
    th:first-child, td:first-child { text-align:left; }
    .scroll { overflow-x:auto; }
    a.voltar { color:var(--mut); text-decoration:none; font-size:14px; }
  </style>
</head>
<body>
  <main id="app">Carregando...</main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
